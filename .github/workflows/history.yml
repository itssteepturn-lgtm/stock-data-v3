name: History Build (Short-term 350d)

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Config git
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Fetch History
        run: python scripts/fetch_history.py
      - name: Fallback push
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          git merge origin/main -X ours --no-edit -m "merge" || true
          git push || true
